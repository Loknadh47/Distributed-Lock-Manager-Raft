syntax = "proto3";

package dlm.v1;

// ---------------------------------------------------------------- Raft (peer to peer)

message LogEntry {
  uint64 term = 1;
  bytes command = 2;  // JSON-encoded command; "null" is a no-op
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
  uint64 conflict_index = 4;
  uint64 conflict_term = 5;
}

service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

// ---------------------------------------------------------------- Lock API (client facing)

message AcquireRequest {
  string resource = 1;
  string owner = 2;
  uint64 ttl_ms = 3;
}

message ReleaseRequest {
  string resource = 1;
  string owner = 2;
  uint64 fencing_token = 3;
}

message RenewRequest {
  string resource = 1;
  string owner = 2;
  uint64 fencing_token = 3;
  uint64 ttl_ms = 4;
}

message StatusRequest {
  string resource = 1;
}

// code: OK | HELD | NOT_HOLDER | EXPIRED          (definitive results)
//       NOT_LEADER | RETRY | TIMEOUT | UNAVAILABLE (retry; TIMEOUT = outcome unknown)
//       INVALID_ARGUMENT
message LockResponse {
  bool ok = 1;
  string code = 2;
  string holder = 3;
  uint64 fencing_token = 4;
  uint64 expires_at_ms = 5;
  string leader_hint = 6;  // address of the leader, set with NOT_LEADER
  string message = 7;
}

service LockService {
  rpc Acquire(AcquireRequest) returns (LockResponse);
  rpc Release(ReleaseRequest) returns (LockResponse);
  rpc Renew(RenewRequest) returns (LockResponse);
  rpc Status(StatusRequest) returns (LockResponse);  // local read, may be stale on followers
}
